name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia: ["pre", "1"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v3

      - run: make deps

      - name: Check formatting
        shell: bash
        run: |
          make format
          if ! git diff --quiet; then
            echo "::warning title=Formatting drift::Run 'make format' locally and commit the resulting changes."
            git diff --stat
            git checkout -- .
          fi

      - name: Regenerate raw binding
        run: make generate && git diff --exit-code -- src/raw.jl

      - name: Run tests and examples
        run: make check

      - name: Build documentation
        run: make docs
